app = "minio-saves"
primary_region = "fra"

[build]

[[mounts]]
source = "minio_data"
destination = "/data"

[[services]]
internal_port = 9000
protocol = "tcp"

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

  [[services.ports]]
  port = 80
  handlers = ["http"]

[[services]]
internal_port = 9001
protocol = "tcp"

  [[services.ports]]
  port = 9001
  handlers = ["tls", "http"]

[[vm]]
size = "shared-cpu-2x"
memory = "2gb"
